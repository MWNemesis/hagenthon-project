<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Risultato — Portal Simulator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="logo">
      <div class="logo-icon">🎓</div>
      Portal<span class="logo-accent">Simulator</span>
    </a>
  </header>

  <div class="result-page">
    <div class="result-card">

      <div id="result-header" class="result-header">
        <div id="retry-badge" class="retry-badge" style="display:none"></div>
        <div id="result-icon" class="result-icon-wrap"></div>
        <h2 id="result-title"></h2>
        <p id="result-subtitle" class="subtitle"></p>
        <div class="result-score" id="result-score"></div>
        <div id="improvement-row" class="improvement-row" style="display:none"></div>
      </div>

      <div class="result-body">
        <div class="result-body-title">Dettaglio passaggi</div>
        <div id="steps-result" class="steps-result"></div>
        <div class="result-actions">
          <a id="btn-retry" class="btn-secondary" href="#">↺ &nbsp;Riprova</a>
          <a class="btn-primary-inline" href="index.html">← Missioni</a>
        </div>
      </div>

    </div>
  </div>

  <script src="js/evaluator.js"></script>
  <script>
    function renderResult() {
      const raw = sessionStorage.getItem('sessionResult');
      if (!raw) { window.location.href = 'index.html'; return; }

      const result  = JSON.parse(raw);
      const mission = JSON.parse(sessionStorage.getItem('currentMission') || '{}');
      const passed  = result.passed;
      const total   = result.steps.length;
      const correct = result.steps.filter(s => s.ok).length;

      // Header
      const header = document.getElementById('result-header');
      header.classList.add(passed ? 'success' : 'error');

      const icon = document.getElementById('result-icon');
      icon.classList.add(passed ? 'success' : 'error');
      icon.textContent = passed ? '✓' : '✕';

      document.getElementById('result-title').textContent =
        passed ? 'Procedura completata!' : 'Riprova ancora';

      document.getElementById('result-subtitle').textContent =
        passed
          ? (mission.successMessage || 'Ottimo! Hai eseguito tutti i passaggi correttamente.')
          : `Hai eseguito ${correct} di ${total} passaggi. Rileggi le istruzioni e riprova.`;

      // Score
      document.getElementById('result-score').innerHTML = `
        <div class="score-stat">
          <div class="score-num" style="color:${passed ? '#16a34a' : '#dc2626'}">${correct}/${total}</div>
          <div class="score-lbl">Passaggi corretti</div>
        </div>
        <div class="score-divider"></div>
        <div class="score-stat">
          <div class="score-num">${result.errors}</div>
          <div class="score-lbl">Errori</div>
        </div>`;

      // Step detail
      document.getElementById('steps-result').innerHTML = result.steps.map(s => `
        <div class="step-result-item ${s.ok ? 'ok' : 'err'}">
          <div class="step-result-icon ${s.ok ? 'ok' : 'err'}">${s.ok ? '✓' : '✕'}</div>
          <div class="step-result-info">
            <div class="step-desc">${s.description}</div>
            ${!s.ok ? `<div class="step-error">${s.errorMessage}</div>` : ''}
          </div>
        </div>`).join('');

      // Retry tracking
      const retryCount = parseInt(sessionStorage.getItem('retryCount') || '1');
      const prevScore  = parseInt(sessionStorage.getItem('prevScore')  ?? '-1');

      if (retryCount > 1) {
        const badge = document.getElementById('retry-badge');
        badge.textContent = `Tentativo ${retryCount}`;
        badge.style.display = 'inline-block';
      }

      if (retryCount > 1 && prevScore >= 0) {
        const delta = correct - prevScore;
        const row = document.getElementById('improvement-row');
        row.style.display = 'flex';
        if (delta > 0) {
          row.innerHTML = `<span class="improvement improvement-up">↑ +${delta} ${delta > 1 ? 'passaggi corretti' : 'passaggio corretto'} rispetto al tentativo precedente</span>`;
        } else if (delta < 0) {
          row.innerHTML = `<span class="improvement improvement-down">↓ ${delta} rispetto al tentativo precedente</span>`;
        } else {
          row.innerHTML = `<span class="improvement improvement-same">= Stesso risultato del tentativo precedente</span>`;
        }
      }

      // Retry button — salva il punteggio corrente prima di ricominciare
      const btnRetry = document.getElementById('btn-retry');
      btnRetry.href = mission.id ? `mission.html?id=${mission.id}` : 'index.html';
      btnRetry.addEventListener('click', () => {
        sessionStorage.setItem('prevScore',   String(correct));
        sessionStorage.setItem('retryCount',  String(retryCount + 1));
      });
    }

    renderResult();
  </script>

</body>
</html>
