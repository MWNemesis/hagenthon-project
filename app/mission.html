<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missione — Portal Simulator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="logo">
      <div class="logo-icon">🎓</div>
      Portal<span class="logo-accent">Simulator</span>
    </a>
    <a href="index.html" class="btn-back">← Missioni</a>
  </header>

  <div class="mission-hero">
    <div class="mission-hero-inner">
      <div class="mission-hero-icon" id="hero-icon">⏳</div>
      <div class="mission-hero-text">
        <h1 id="mission-title">Caricamento...</h1>
        <p id="mission-desc"></p>
        <div class="mission-hero-chips" id="hero-chips"></div>
      </div>
    </div>
  </div>

  <main class="page-container">
    <div class="mission-detail-layout">

      <div class="mission-explanation">
        <div class="explanation-section">
          <h2>Contesto</h2>
          <p id="mission-explanation"></p>
        </div>
        <div class="explanation-section">
          <h2>Passaggi da eseguire</h2>
          <ol id="steps-list" class="steps-list"></ol>
        </div>
      </div>

      <aside class="info-card">
        <div class="info-card-header">
          <h3>Dettagli missione</h3>
        </div>
        <div class="info-card-body">
          <div class="info-row">
            <span class="label">Difficoltà</span>
            <span class="value" id="info-difficulty">—</span>
          </div>
          <div class="info-row">
            <span class="label">Durata stimata</span>
            <span class="value" id="info-time">—</span>
          </div>
          <div class="info-row">
            <span class="label">Passaggi</span>
            <span class="value" id="info-steps">—</span>
          </div>
          <a id="btn-start" class="btn-primary" href="#">
            ▶ &nbsp;Inizia simulazione
          </a>
        </div>
      </aside>

    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const missionId = params.get('id');

    function loadMission() {
      if (!missionId) { window.location.href = 'index.html'; return; }
      try {
        const stored = sessionStorage.getItem('currentMission');
        if (!stored) throw new Error('no data');
        const m = JSON.parse(stored);
        if (m.id !== missionId) throw new Error('id mismatch');
        render(m);
      } catch {
        document.getElementById('mission-title').textContent = 'Missione non trovata';
        document.getElementById('mission-desc').textContent = 'Torna alla lista missioni e riprova.';
      }
    }

    function render(m) {
      document.title = `${m.title} — Portal Simulator`;

      document.getElementById('hero-icon').textContent = m.icon || '📌';
      document.getElementById('mission-title').textContent = m.title;
      document.getElementById('mission-desc').textContent = m.description;
      document.getElementById('mission-explanation').textContent = m.explanation;

      const diffLabel = { base: 'Base', medio: 'Medio', avanzato: 'Avanzato' }[m.difficulty] || m.difficulty;
      document.getElementById('info-difficulty').textContent = diffLabel;
      document.getElementById('info-time').textContent = `${m.estimatedMinutes} min`;
      document.getElementById('info-steps').textContent = `${m.steps.length} step`;

      document.getElementById('hero-chips').innerHTML = `
        <div class="hero-chip">⏱ ${m.estimatedMinutes} min</div>
        <div class="hero-chip">📋 ${m.steps.length} step</div>
        <div class="hero-chip">📊 ${diffLabel}</div>`;

      document.getElementById('steps-list').innerHTML = m.steps.map((s, i) => `
        <li class="step-item">
          <div class="step-left">
            <div class="step-number">${i + 1}</div>
          </div>
          <span class="step-text">${s.description}</span>
        </li>`).join('');

      document.getElementById('btn-start').href = m.simulator;
      sessionStorage.setItem('currentMission', JSON.stringify(m));
    }

    loadMission();
  </script>

</body>
</html>
