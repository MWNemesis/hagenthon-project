<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Simulator — Missioni</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="logo">
      <div class="logo-icon">🎓</div>
      Portal<span class="logo-accent">Simulator</span>
    </a>
  </header>

  <div class="hero">
    <div class="hero-inner">
      <div class="hero-eyebrow">✦ Training Portal</div>
      <h1>Impara facendo,<br/>non leggendo.</h1>
      <p>Scegli una missione, segui le istruzioni e mettiti alla prova nel simulatore del portale aziendale.</p>
      <div class="hero-stats" id="hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-num" id="stat-total">—</div>
          <div class="hero-stat-label">Missioni disponibili</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-num">3</div>
          <div class="hero-stat-label">Livelli di difficoltà</div>
        </div>
      </div>
    </div>
  </div>

  <main class="page-container">
    <div class="section-header">
      <div class="section-title" id="section-label">Tutte le missioni</div>
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filter('all', this)">Tutte</button>
        <button class="filter-btn" onclick="filter('base', this)">Base</button>
        <button class="filter-btn" onclick="filter('medio', this)">Medio</button>
        <button class="filter-btn" onclick="filter('avanzato', this)">Avanzato</button>
      </div>
    </div>

    <div id="missions-grid" class="missions-grid"></div>
  </main>

  <script>
    const MISSIONS = [
      // Aggiungere i path dei JSON delle missioni generate
      // Es: 'missions/crea-ticket.json'
    ];

    let allMissions = [];

    async function loadMissions() {
      const grid = document.getElementById('missions-grid');

      if (MISSIONS.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div class="empty-icon">🚧</div>
            <p>Nessuna missione disponibile.<br/>Le missioni vengono generate dagli agenti con <strong>/generate-mission</strong>.</p>
          </div>`;
        document.getElementById('stat-total').textContent = '0';
        return;
      }

      const results = await Promise.all(MISSIONS.map(async path => {
        try { return await (await fetch(path)).json(); } catch { return null; }
      }));

      allMissions = results.filter(Boolean);
      document.getElementById('stat-total').textContent = allMissions.length;
      renderCards(allMissions);
    }

    function renderCards(list) {
      const grid = document.getElementById('missions-grid');
      if (!list.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">🔍</div><p>Nessuna missione per questo livello.</p></div>`;
        return;
      }
      grid.innerHTML = list.map(missionCard).join('');
    }

    function filter(level, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filtered = level === 'all' ? allMissions : allMissions.filter(m => m.difficulty === level);
      document.getElementById('section-label').textContent =
        level === 'all' ? 'Tutte le missioni' : `Missioni — ${level.charAt(0).toUpperCase() + level.slice(1)}`;
      renderCards(filtered);
    }

    function missionCard(m) {
      const badgeClass = { base: 'badge-base', medio: 'badge-medio', avanzato: 'badge-avanzato' }[m.difficulty] || 'badge-base';
      return `
        <a class="mission-card" href="mission.html?id=${m.id}">
          <div class="mission-card-top">
            <div class="mission-icon">${m.icon || '📌'}</div>
            <span class="badge ${badgeClass}">${m.difficulty || 'base'}</span>
          </div>
          <div class="mission-card-body">
            <h3>${m.title}</h3>
            <p>${m.description}</p>
          </div>
          <div class="mission-card-footer">
            <div class="mission-meta">
              <span>⏱ ${m.estimatedMinutes} min</span>
              <span>📋 ${m.steps.length} step</span>
            </div>
            <span class="mission-cta">Inizia →</span>
          </div>
        </a>`;
    }

    loadMissions();
  </script>

</body>
</html>
